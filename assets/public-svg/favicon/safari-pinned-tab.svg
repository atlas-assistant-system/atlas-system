<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>ATLAS Safari Pinned Tab</title>
  <desc>ATLAS Safari pinned tab icon. Pure black, path-only, no gradients, no opacity effects, no masks. Required format for Safari pinned tab SVG.</desc>

  <defs>
    <clipPath id="fc">
      <circle cx="16" cy="12" r="10"/>
    </clipPath>
  </defs>
  <circle cx="16" cy="12" r="10" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
  <g clip-path="url(#fc)">
    <ellipse cx="16" cy="12" rx="10" ry="3" fill="none" stroke="#000000" stroke-width="0.9"/>
    <line x1="16" y1="2" x2="16" y2="22" stroke="#000000" stroke-width="0.9" stroke-linecap="round"/>
  </g>
  <line x1="16" y1="22" x2="16" y2="28" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="10" y1="28" x2="22" y2="28" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
</svg>
